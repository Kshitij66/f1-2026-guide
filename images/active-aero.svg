<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img"><title>Corner Mode vs Straight Mode</title>
<rect width="640" height="260" fill="#f4f4f6" rx="8"/>
<g font-family="sans-serif">
<text x="160" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#15151e">Corner Mode</text>
<text x="160" y="62" text-anchor="middle" font-size="13" fill="#5b5b66">Wings closed → more downforce</text>
<path d="M60 150 L260 120" stroke="#15151e" stroke-width="12" stroke-linecap="round"/>
<path d="M60 175 L260 145" stroke="#d7261e" stroke-width="12" stroke-linecap="round"/>
<path d="M90 210 l0 -20 m0 20 l-6 -8 m6 8 l6 -8 M160 210 l0 -20 m0 20 l-6 -8 m6 8 l6 -8 M230 210 l0 -20 m0 20 l-6 -8 m6 8 l6 -8" stroke="#d7261e" stroke-width="3" fill="none"/>
<text x="160" y="236" text-anchor="middle" font-size="13" fill="#15151e">Grip pushes car into track</text>
<line x1="320" y1="30" x2="320" y2="236" stroke="#e2e2e8" stroke-width="2"/>
<text x="480" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#15151e">Straight Mode</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#5b5b66">Wings open → less drag</text>
<path d="M380 120 L580 112" stroke="#15151e" stroke-width="12" stroke-linecap="round"/>
<path d="M380 175 L580 167" stroke="#d7261e" stroke-width="12" stroke-linecap="round"/>
<path d="M380 145 h190 m0 0 l-10 -7 m10 7 l-10 7" stroke="#2a7de1" stroke-width="3" fill="none"/>
<text x="480" y="236" text-anchor="middle" font-size="13" fill="#15151e">Higher top speed on straights</text>
</g></svg>
